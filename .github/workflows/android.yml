name: Android Build

on:
  push:
    branches: [ "main", "fix-*", "dev-*" ]
    paths-ignore:
      - '**.md'      
      - '.gitignore'           
      - '.github/workflows/**' 
      - 'docs/**'
  workflow_dispatch:              
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets and Sync
        run: |
          pnpm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Decode Keystore and Map Environment
        working-directory: ./android
        run: |
          mkdir -p keystore
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/personal-release.p12
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/debug-* || "${{ github.ref }}" == refs/heads/fix-* || "${{ github.ref }}" == refs/heads/dev-* ]]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/personal-debug.p12
            echo "DEBUG_STORE_PASSWORD=${{ secrets.DEBUG_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "DEBUG_KEY_ALIAS=${{ secrets.DEBUG_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "DEBUG_KEY_PASSWORD=${{ secrets.DEBUG_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build and Configure APK
        working-directory: ./android
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Branch Main detectada. Executando Build Release com R8."
            ./gradlew assembleRelease
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=OTM-Release-Build" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/debug-* || "${{ github.ref }}" == refs/heads/fix-* || "${{ github.ref }}" == refs/heads/dev-* ]]; then
            echo "Branch Debug detectada. Executando Build Debug sem R8."
            ./gradlew assembleDebug
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=OTM-Debug-Build" >> $GITHUB_ENV
          else
            echo "Erro Crítico: Gatilho disparado por branch não mapeada [${{ github.ref }}]."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 1

      - name: Cleanup Keystore
        if: always()
        working-directory: ./android
        run: rm -f keystore/*.p12
