name: Android Debug Build

on:
  push:
    branches: [ "dev-*", "fix-*" ]
    paths-ignore:
      - '**.md'      
      - '.gitignore'           
      - '.github/workflows/**' 
      - 'docs/**'
  workflow_dispatch:              
      
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets and Sync
        run: |
          pnpm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OTM-Debug-Unsigned.apk
          echo "APK_PATH=android/app/build/outputs/apk/debug/OTM-Debug-Unsigned.apk" >> $GITHUB_ENV

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-debug-apk
          path: ${{ env.APK_PATH }}
          archive: false
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Unsigned APK
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: unsigned-debug-apk

      - name: Decode Keystore and Sign
        run: |
          mkdir -p keystore
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/personal-debug.p12
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          
          $APKSIGNER sign \
            --ks keystore/personal-debug.p12 \
            --ks-key-alias "${{ secrets.DEBUG_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.DEBUG_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.DEBUG_KEY_PASSWORD }}" \
            --out OTM-Debug-Build.apk \
            OTM-Debug-Unsigned.apk
            
          rm -rf keystore

      - name: Upload Signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-debug-apk
          path: OTM-Debug-Build.apk
          archive: false
          retention-days: 1
