name: Android Debug Build

on:
#  push:
#    branches: [ "dev-*", "fix-*" ]
#    paths-ignore:
#      - '**.md'      
#      - '.gitignore'           
#      - '.github/workflows/**' 
#      - 'docs/**'
  workflow_dispatch:              
      
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apk_build.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets and Sync
        run: |
          pnpm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Unsigned APK
        id: apk_build
        working-directory: ./android
        run: |
          ./gradlew assembleDebug
          VERSION=$(node ../scripts/get-version.js)
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/otm_debug_unsigned.apk
          echo "APK_PATH=android/app/build/outputs/apk/debug/otm_debug_unsigned.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ env.APK_PATH }}
          archive: false
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: otm_debug_unsigned.apk

      - name: Decode Keystore and Sign
        run: |
          mkdir -p keystore
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > keystore/personal-debug.p12
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -r | head -n 1)
          
          VERSION="${{ needs.build.outputs.version }}"
          UNSIGNED_APK="otm_${VERSION}_debug_unsigned.apk"
          ALIGNED_APK="otm_${VERSION}_debug_aligned.apk"
          SIGNED_APK="otm_${VERSION}_debug.apk"
          
          mv otm_debug_unsigned.apk $UNSIGNED_APK
          
          $ZIPALIGN -p -f -v 4 $UNSIGNED_APK $ALIGNED_APK
          
          $APKSIGNER sign \
            --ks keystore/personal-debug.p12 \
            --ks-key-alias "${{ secrets.DEBUG_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.DEBUG_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.DEBUG_KEY_PASSWORD }}" \
            --out $SIGNED_APK \
            $ALIGNED_APK
            
          echo "SIGNED_APK=${SIGNED_APK}" >> $GITHUB_ENV
            
          rm -rf keystore

      - name: Upload Signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-debug-apk
          path: ${{ env.SIGNED_APK }}
          archive: false
          retention-days: 1
