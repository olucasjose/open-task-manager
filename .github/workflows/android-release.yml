name: Android Release Build

on:
  push:
#    branches: [ "main", "rc-*" ]
#    paths-ignore:
#      - '**.md'      
#      - '.gitignore'           
#      - '.github/workflows/**' 
#      - 'docs/**'
  workflow_dispatch:              
      
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets and Sync
        run: |
          pnpm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Unsigned APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/OTM-Release-Unsigned.apk
          echo "APK_PATH=android/app/build/outputs/apk/release/OTM-Release-Unsigned.apk" >> $GITHUB_ENV

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-apk
          path: ${{ env.APK_PATH }}
          archive: false
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: OTM-Release-Unsigned.apk

      - name: Decode Keystore and Sign
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/personal-release.p12
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -r | head -n 1)
          
          $ZIPALIGN -p -f -v 4 OTM-Release-Unsigned.apk OTM-Release-Aligned.apk
          
          $APKSIGNER sign \
            --ks keystore/personal-release.p12 \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.RELEASE_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out OTM-Release-Build.apk \
            OTM-Release-Aligned.apk
            
          rm -rf keystore

      - name: Upload Signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-apk
          path: OTM-Release-Build.apk
          archive: false
          retention-days: 1
