name: Android Release Build

on:
  push:
    branches: [ "main", "rc-*" ]
    paths-ignore:
      - '**.md'      
      - '.gitignore'           
      - '.github/workflows/**' 
      - 'docs/**'
  workflow_dispatch:              
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web Assets and Sync
        run: |
          pnpm run build
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Decode Keystore and Map Environment
        working-directory: ./android
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/personal-release.p12
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build and Configure APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/OTM-Release-Build.apk
          echo "APK_PATH=android/app/build/outputs/apk/release/OTM-Release-Build.apk" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_PATH }}
          archive: false
          retention-days: 1

      - name: Cleanup Keystore
        if: always()
        working-directory: ./android
        run: rm -f keystore/*.p12
